# ld65 configuration for the Megabyter smoke test: bank 0 at $8000,
# test code copied to and run from $C100 (the cartridge is switched off
# during the tests).
MEMORY {
    ZP:  start = $00FB, size = $0004;
    ROM: start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
    RAM: start = $C100, size = $0400, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    HEADER:   load = ROM, type = ro;
    STARTUP:  load = ROM, type = ro;
    RAMCODE:  load = ROM, run = RAM, type = rw, define = yes;
}
