# ld65 configuration for the C64 boot ROM (Megabyter bank 0): start-up at
# $8000, the loader copied to and run from $0200.
MEMORY {
    ROM:  start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
    LRAM: start = $0200, size = $0200, file = "";
}
SEGMENTS {
    HEADER:  load = ROM, type = ro;
    STARTUP: load = ROM, type = ro;
    LOADER:  load = ROM, run = LRAM, type = rw, define = yes;
}
