    KOVL54: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL55: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL56: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL57: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL58: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL59: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL60: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL61: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL62: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL63: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL64: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KBF:  start = $BF40, size = $00C0, file = "build/kbf64.bin";   # below the kernal, after the bitmap
    KLO:  start = $C000, size = $1000, fill = yes, fillval = $00, file = %O;
    KIO:  start = $D000, size = $1000, fill = yes, fillval = $00, file = %O;
    KHI:  start = $E000, size = $1E80, fill = yes, fillval = $00, file = %O;
    KINP: start = $FE80, size = $017A, fill = yes, fillval = $00, file = %O;
    KVEC: start = $FFFA, size = $0006, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    INIT:    load = KINIT, type = ro;   # cold start: run once from $4F00,
                                        # then application memory
    DRIVER:  load = KDRV, type = rw, start = $9000;
    DRVEXT:  load = KDRV, type = rw;    # resident helpers after the driver
                                        # (its vectors must stay at $9000)
    OVL0:    load = KOVL0, type = ro;
    OVL1:    load = KOVL1, type = ro, optional = yes;
    OVL2:    load = KOVL2, type = ro, optional = yes;
    OVL3:    load = KOVL3, type = ro, optional = yes;
    OVL4:    load = KOVL4, type = ro, optional = yes;   # bypass.s
    OVL5:    load = KOVL5, type = ro;   # GraphicsString (gstring.s)
    OVL6:    load = KOVL6, type = ro;   # native BAM copy, free count (reudrv.s)
    OVL7:    load = KOVL7, type = ro;   # 1571 allocation (reudrv.s)
    OVL8:    load = KOVL8, type = ro;   # hibernation: suspend (hibernate.s)
    OVL9:    load = KOVL9, type = ro;   # hibernation: resume (hibresume.s)
    OVL10:   load = KOVL10, type = ro;  # hibernation: the clock (hibernate.s)
    OVL11:   load = KOVL11, type = ro;  # dialog state (dialog.s)
    OVL12:   load = KOVL12, type = ro;  # folders (folders.s)
    OVL13:   load = KOVL13, type = ro;  # SetGEOSDisk, RemoveDir (folders.s)
    OVL14:   load = KOVL14, type = ro;  # MakeDir (folders.s)
    OVL15:   load = KOVL15, type = ro;  # drive E (sysdrive.s)
    OVL16:   load = KOVL16, type = ro;  # turbo per application (speed.s)
    OVL17:   load = KOVL17, type = ro;  # root folder fonts and DAs (rootmerge.s)
    OVL18:   load = KOVL18, type = ro;  # 1581 partitions as folders (folders.s)
    OVL19:   load = KOVL19, type = ro;  # 1581 partition created (folders.s)
    OVL20:   load = KOVL20, type = ro;  # 1581 partition formatted
    OVL21:   load = KOVL21, type = ro;  # 1581 partition removed
    OVL22:   load = KOVL22, type = ro;  # file engine: dispatcher (engine.s)
    OVL23:   load = KOVL23, type = ro;  # file engine: path made absolute (enginepath.s)
    OVL24:   load = KOVL24, type = ro;  # file engine: path walked
    OVL25:   load = KOVL25, type = ro;  # file engine: stat, free space (enginedir.s)
    OVL26:   load = KOVL26, type = ro;  # file engine: directory opened
    OVL27:   load = KOVL27, type = ro;  # file engine: delete, rename, folders (enginefile.s)
    OVL28:   load = KOVL28, type = ro;  # file engine: directory read (enginedir.s)
    OVL29:   load = KOVL29, type = ro;  # file engine: copy, move (enginecopy.s)
    OVL30:   load = KOVL30, type = ro;  # file engine: the target of a copy
    OVL31:   load = KOVL31, type = ro;  # file engine: the blocks of a copy
    OVL32:   load = KOVL32, type = ro;  # file engine: stream opened (enginestream.s)
    OVL33:   load = KOVL33, type = ro;  # file engine: a new file for a stream
    OVL34:   load = KOVL34, type = ro;  # file engine: stream read
    OVL35:   load = KOVL35, type = ro;  # file engine: stream written
    OVL36:   load = KOVL36, type = ro;  # file engine: the Ultimate's DOS (engineult.s)
    OVL37:   load = KOVL37, type = ro;  # file engine: stat on the Ultimate
    OVL38:   load = KOVL38, type = ro;  # file engine: an Ultimate listing read
    OVL39:   load = KOVL39, type = ro;  # file engine: an Ultimate listing's entries
    OVL40:   load = KOVL40, type = ro;  # file engine: the listing of "/"
    OVL41:   load = KOVL41, type = ro;  # file engine: delete, folders, rename on the Ultimate
    OVL42:   load = KOVL42, type = ro;  # file engine: copy onto the Ultimate (enginexfer.s)
    OVL43:   load = KOVL43, type = ro;  # file engine: copy from the Ultimate
    OVL44:   load = KOVL44, type = ro;  # file engine: its blocks onto a GEOS drive
    OVL45:   load = KOVL45, type = ro;  # file engine: blocks onto the Ultimate
    OVL46:   load = KOVL46, type = ro;  # file engine: a new entry from an Ultimate file
    OVL47:   load = KOVL47, type = ro;  # file engine: an Ultimate listing read (engineult.s)
    OVL48:   load = KOVL48, type = ro;  # file engine: long names looked up (enginelong.s)
    OVL49:   load = KOVL49, type = ro;  # file engine: GU.LONGNAMES kept
    OVL50:   load = KOVL50, type = ro;  # file engine: short names made
    OVL51:   load = KOVL51, type = ro;  # file engine: names: listing, rename, mkdir, drop
    OVL52:   load = KOVL52, type = ro;  # file engine: a copy's new entry
    OVL53:   load = KOVL53, type = ro;  # file engine: GU.LONGNAMES made
    OVL54:   load = KOVL54, type = ro;  # file engine: rename, mkdir with long names
    OVL55:   load = KOVL55, type = ro;  # FE_RUNSYS: an application on drive E (sysdrive.s)
    OVL56:   load = KOVL56, type = ro;  # file engine: a GEOS file onto the Ultimate as CVT (enginecvt.s)
    OVL57:   load = KOVL57, type = ro;  # file engine: a CVT from the Ultimate converted
    OVL58:   load = KOVL58, type = ro;  # file engine: a VLIR file's records onto the Ultimate as CVT
    OVL59:   load = KOVL59, type = ro;  # file engine: a CVT's VLIR records converted
    OVL60:   load = KOVL60, type = ro;  # file engine: a CVT recognised
    OVL61:   load = KOVL61, type = ro;  # file engine: FE_OPEN on the Ultimate (enginestreamu.s)
    OVL62:   load = KOVL62, type = ro;  # file engine: FE_READ on the Ultimate
    OVL63:   load = KOVL63, type = ro;  # file engine: FE_WRITE on the Ultimate
    OVL64:   load = KOVL64, type = ro;  # file engine: an Ultimate stream's setup
    KEXT:    load = KDRV, type = rw, start = $9A80;   # kernal code until the
                                        # overlay slot exists (ARCHITECTURE.md)
    BFCODE:  load = KBF,  type = ro;
    INFO:    load = KLO,  type = rw, start = $C000;
    JUMPTAB: load = KLO,  type = ro, start = $C100;
    CODE:    load = KHI,  type = ro;
    RODATA:  load = KLO,  type = ro;
    DATA:    load = KLO,  type = rw;
    KSTATE:  load = KLO,  type = rw, define = yes;   # saved by DoDlgBox
    KCODE:   load = KLO,  type = ro, define = yes;    # code in the low kernal area
    IODATA:  load = KIO,  type = rw, optional = yes;
    IOCODE:  load = KIO,  type = ro;    # runs with $01 = $30 only: never
                                        # from the IRQ, never with I/O on
    INPUT:   load = KINP, type = rw;
    VECTORS: load = KVEC, type = ro;
}
