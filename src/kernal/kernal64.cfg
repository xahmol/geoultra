# ld65 configuration for the GeoUltra C64 kernal: one 16 KB image of
# $C000-$FFFF and the disk driver at $9000 (docs/ARCHITECTURE.md, "C64
# memory map"; the driver ends before dir3Head at $9C80).
MEMORY {
    KDRV: start = $9000, size = $0C80, file = "build/reudrv64.bin";
    KINIT: start = $4F00, size = $1100, file = "build/init64.bin";  # below the background screen; $4000-$4E7F: mount.s buffers
    # Overlay modules: all run at $9D80, stored one after the other in
    # build/overlays64.bin (REU $020000 at run time, src/kernal/overlay.s)
    KOVL0: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL1: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL2: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL3: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL4: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL5: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL6: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL7: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL8: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL9: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL10: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL11: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL12: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL13: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL14: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL15: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL16: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL17: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL18: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL19: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL20: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL21: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL22: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL23: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL24: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL25: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL26: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL27: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL28: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KBF:  start = $BF40, size = $00C0, file = "build/kbf64.bin";   # below the kernal, after the bitmap
    KLO:  start = $C000, size = $1000, fill = yes, fillval = $00, file = %O;
    KIO:  start = $D000, size = $1000, fill = yes, fillval = $00, file = %O;
    KHI:  start = $E000, size = $1E80, fill = yes, fillval = $00, file = %O;
    KINP: start = $FE80, size = $017A, fill = yes, fillval = $00, file = %O;
    KVEC: start = $FFFA, size = $0006, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    INIT:    load = KINIT, type = ro;   # cold start: run once from $4F00,
                                        # then application memory
    DRIVER:  load = KDRV, type = rw, start = $9000;
    DRVEXT:  load = KDRV, type = rw;    # resident helpers after the driver
                                        # (its vectors must stay at $9000)
    OVL0:    load = KOVL0, type = ro;
    OVL1:    load = KOVL1, type = ro, optional = yes;
    OVL2:    load = KOVL2, type = ro, optional = yes;
    OVL3:    load = KOVL3, type = ro, optional = yes;
    OVL4:    load = KOVL4, type = ro, optional = yes;   # bypass.s
    OVL5:    load = KOVL5, type = ro;   # GraphicsString (gstring.s)
    OVL6:    load = KOVL6, type = ro;   # native BAM copy, free count (reudrv.s)
    OVL7:    load = KOVL7, type = ro;   # 1571 allocation (reudrv.s)
    OVL8:    load = KOVL8, type = ro;   # hibernation: suspend (hibernate.s)
    OVL9:    load = KOVL9, type = ro;   # hibernation: resume (hibresume.s)
    OVL10:   load = KOVL10, type = ro;  # hibernation: the clock (hibernate.s)
    OVL11:   load = KOVL11, type = ro;  # dialog state (dialog.s)
    OVL12:   load = KOVL12, type = ro;  # folders (folders.s)
    OVL13:   load = KOVL13, type = ro;  # SetGEOSDisk, RemoveDir (folders.s)
    OVL14:   load = KOVL14, type = ro;  # MakeDir (folders.s)
    OVL15:   load = KOVL15, type = ro;  # drive E (sysdrive.s)
    OVL16:   load = KOVL16, type = ro;  # turbo per application (speed.s)
    OVL17:   load = KOVL17, type = ro;  # root folder fonts and DAs (rootmerge.s)
    OVL18:   load = KOVL18, type = ro;  # 1581 partitions as folders (folders.s)
    OVL19:   load = KOVL19, type = ro;  # 1581 partition created (folders.s)
    OVL20:   load = KOVL20, type = ro;  # 1581 partition formatted
    OVL21:   load = KOVL21, type = ro;  # 1581 partition removed
    OVL22:   load = KOVL22, type = ro;  # file engine: dispatcher (engine.s)
    OVL23:   load = KOVL23, type = ro;  # file engine: path made absolute (enginepath.s)
    OVL24:   load = KOVL24, type = ro;  # file engine: path walked
    OVL25:   load = KOVL25, type = ro;  # file engine: stat, free space (enginedir.s)
    OVL26:   load = KOVL26, type = ro;  # file engine: directory opened
    OVL27:   load = KOVL27, type = ro;  # file engine: delete, rename, folders (enginefile.s)
    OVL28:   load = KOVL28, type = ro;  # file engine: directory read (enginedir.s)
    KEXT:    load = KDRV, type = rw, start = $9A80;   # kernal code until the
                                        # overlay slot exists (ARCHITECTURE.md)
    BFCODE:  load = KBF,  type = ro;
    INFO:    load = KLO,  type = rw, start = $C000;
    JUMPTAB: load = KLO,  type = ro, start = $C100;
    CODE:    load = KHI,  type = ro;
    RODATA:  load = KLO,  type = ro;
    DATA:    load = KLO,  type = rw;
    KSTATE:  load = KLO,  type = rw, define = yes;   # saved by DoDlgBox
    KCODE:   load = KLO,  type = ro, define = yes;    # code in the low kernal area
    IODATA:  load = KIO,  type = rw, optional = yes;
    IOCODE:  load = KIO,  type = ro;    # runs with $01 = $30 only: never
                                        # from the IRQ, never with I/O on
    INPUT:   load = KINP, type = rw;
    VECTORS: load = KVEC, type = ro;
}
