# ld65 configuration for the GeoUltra C64 kernal: one 16 KB image of
# $C000-$FFFF and the disk driver at $9000 (docs/ARCHITECTURE.md, "C64
# memory map"; the driver ends before dir3Head at $9C80).
MEMORY {
    KDRV: start = $9000, size = $0C80, file = "build/reudrv64.bin";
    KINIT: start = $5000, size = $1000, file = "build/init64.bin";
    # Overlay modules: all run at $9D80, stored one after the other in
    # build/overlays64.bin (REU $020000 at run time, src/kernal/overlay.s)
    KOVL0: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL1: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL2: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KOVL3: start = $9D80, size = $01F0, fill = yes, fillval = $00, file = "build/overlays64.bin";
    KLO:  start = $C000, size = $1000, fill = yes, fillval = $00, file = %O;
    KIO:  start = $D000, size = $1000, fill = yes, fillval = $00, file = %O;
    KHI:  start = $E000, size = $1E80, fill = yes, fillval = $00, file = %O;
    KINP: start = $FE80, size = $017A, fill = yes, fillval = $00, file = %O;
    KVEC: start = $FFFA, size = $0006, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    INIT:    load = KINIT, type = ro;   # cold start: run once from $5000,
                                        # then application memory
    DRIVER:  load = KDRV, type = rw, start = $9000;
    DRVEXT:  load = KDRV, type = rw;    # resident helpers after the driver
                                        # (its vectors must stay at $9000)
    OVL0:    load = KOVL0, type = ro;
    OVL1:    load = KOVL1, type = ro, optional = yes;
    OVL2:    load = KOVL2, type = ro, optional = yes;
    OVL3:    load = KOVL3, type = ro, optional = yes;
    KEXT:    load = KDRV, type = rw, start = $9A80;   # kernal code until the
                                        # overlay slot exists (ARCHITECTURE.md)
    INFO:    load = KLO,  type = rw, start = $C000;
    JUMPTAB: load = KLO,  type = ro, start = $C100;
    CODE:    load = KHI,  type = ro;
    RODATA:  load = KLO,  type = ro;
    DATA:    load = KLO,  type = rw;
    KSTATE:  load = KLO,  type = rw, define = yes;   # saved by DoDlgBox
    KCODE:   load = KLO,  type = ro;    # code in the low kernal area
    IODATA:  load = KIO,  type = rw, optional = yes;
    IOCODE:  load = KIO,  type = ro;    # runs with $01 = $30 only: never
                                        # from the IRQ, never with I/O on
    INPUT:   load = KINP, type = rw;
    VECTORS: load = KVEC, type = ro;
}
