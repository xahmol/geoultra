# ld65 configuration for GeoUltra Settings (docs/SETTINGS.md,
# "Structure"): a GEOS application, a VLIR file. Record 0, the core, at
# $0400-$4FFF; records 1 to 6, one overlay per page (ovl.s), at the
# transient area $5000-$5FFF, written to %O.1 to %O.6 (tools/vlircvt.py
# makes the CVT). $6000-$7F3F is GEOS's background screen (menus and
# dialogs give back what was under them from it).
MEMORY {
    ZP:   start = $0080, size = $0060;
    APP:  start = $0400, size = $4C00, file = %O;
    OVL1: start = $5000, size = $1000, file = "%O.1";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp, optional = yes;
    CODE:     load = APP,  type = ro;
    DATA:     load = APP,  type = rw;
    BSS:      load = APP,  type = bss, define = yes;
    OV1:      load = OVL1, type = rw;
}
