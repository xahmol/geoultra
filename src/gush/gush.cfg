# ld65 configuration for gush (a GEOS application at $0400; docs/GUSH.md).
# The code, its data and small variables at $0400-$5FFF; the large
# buffers (HIGHBSS: the screen shadow, the words, file texts, paths) in
# the background screen buffer $6000-$7F3F, which gush does not draw on
# (it draws the foreground only); kept in the REU while a desk accessory
# runs (prog.s).
MEMORY {
    ZP:   start = $0080, size = $0070;
    APP:  start = $0400, size = $5C00, file = %O;
    HIGH: start = $6000, size = $1F40;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = APP, type = ro;
    DATA:     load = APP, type = rw;
    BSS:      load = APP, type = bss, define = yes;
    HIGHBSS:  load = HIGH, type = bss;
}
