# ld65 configuration for gush (a GEOS application at $0400; docs/GUSH.md).
MEMORY {
    ZP:   start = $0080, size = $0070;
    APP:  start = $0400, size = $5C00, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    CODE:     load = APP, type = ro;
    DATA:     load = APP, type = rw;
    BSS:      load = APP, type = bss, define = yes;
}
