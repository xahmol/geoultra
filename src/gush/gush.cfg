# ld65 configuration for gush (a GEOS application, a VLIR file; docs/design/GUSH.md,
# "Memory"). Record 0, the resident core: its code, data and small
# variables at $0400-$4FFF. Records 1-4, the overlays (ovl.s): linked at
# the transient area $5000-$5FFF, written to %O.1 to %O.4 (tools/
# vlircvt.py makes the CVT). The large buffers (HIGHBSS: the screen
# shadow, the words, file texts, paths) in the background screen buffer
# $6000-$7F3F, which gush does not draw on (it draws the foreground
# only); kept in the REU while a desk accessory runs (prog.s).
MEMORY {
    ZP:   start = $0080, size = $0060;    # ($E0-$EF: external commands)
    APP:  start = $0400, size = $4C00, file = %O;
    OVL1: start = $5000, size = $1000, file = "%O.1";
    OVL2: start = $5000, size = $1000, file = "%O.2";
    OVL3: start = $5000, size = $1000, file = "%O.3";
    OVL4: start = $5000, size = $1000, file = "%O.4";
    HIGH: start = $6000, size = $1F40;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = APP,  type = ro;
    DATA:     load = APP,  type = rw;
    BSS:      load = APP,  type = bss, define = yes;
    OV1:      load = OVL1, type = rw, optional = yes;
    OV2:      load = OVL2, type = rw, optional = yes;
    OV3:      load = OVL3, type = rw, optional = yes;
    OV4:      load = OVL4, type = rw, optional = yes;
    HIGHBSS:  load = HIGH, type = bss;
}
