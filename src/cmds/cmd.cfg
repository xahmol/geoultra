# ld65 configuration for an external gush command (docs/GUSH_COMMANDS.md):
# code and data at gush's transient area $5000, 4 KB at most; BSS after
# them, in the same area.
MEMORY {
    ZP:    start = $00E0, size = $0010;
    TRANS: start = $5000, size = $1000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp, optional = yes;
    CODE:     load = TRANS, type = ro;
    DATA:     load = TRANS, type = rw, optional = yes;
    BSS:      load = TRANS, type = bss, optional = yes;
}
