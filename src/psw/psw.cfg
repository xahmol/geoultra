# ld65 configuration for GU PostScript (a GEOS application at $0400; its
# buffers from $2D00 up, src/psw/psw.inc). BSS after the line's arrays
# ($5970-$5FFF; psw.inc asserts the buffers end there), cleared at the
# start (psw.s).
MEMORY {
    ZP:   start = $90,   size = $60,   type = rw;
    APP:  start = $0400, size = $2900, file = %O;
    VARS: start = $5970, size = $0690, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = APP,  type = ro;
    BSS:      load = VARS, type = bss, define = yes;
}
