# ld65 configuration for GU PostScript (a GEOS application at $0400; its
# buffers from $2C00 up, src/psw/psw.inc). BSS in the free space after
# the line's arrays ($5960-$5FFF), cleared at the start (psw.s).
MEMORY {
    ZP:   start = $90,   size = $60,   type = rw;
    APP:  start = $0400, size = $2800, file = %O;
    VARS: start = $5960, size = $06A0, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = APP,  type = ro;
    BSS:      load = VARS, type = bss, define = yes;
}
