# ld65 configuration for GU PostScript (a GEOS application at $0400; its
# buffers from $2D80 up, src/psw/psw.inc). BSS after the line's arrays
# ($5A00-$5FFF; $80 more code since 2026-11-25, the progress box; psw.inc asserts the buffers end there), cleared at the
# start (psw.s).
MEMORY {
    ZP:   start = $90,   size = $60,   type = rw;
    APP:  start = $0400, size = $2980, file = %O;
    VARS: start = $5A00, size = $0600, type = rw;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = APP,  type = ro;
    BSS:      load = VARS, type = bss, define = yes;
}
