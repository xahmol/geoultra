# ld65 configuration for GeoUltra's desktop (docs/DESKTOP.md,
# "Structure"): a GEOS application, a VLIR file. Record 0, the core, at
# $0400-$4FFF; records 1 to 5, the overlays (ovl.s), at the transient
# area $5000-$5FFF, written to %O.1 to %O.5 (tools/vlircvt.py makes the
# CVT). $6000-$7F3F is GEOS's background screen, which the desktop uses.
MEMORY {
    ZP:   start = $0080, size = $0060;
    APP:  start = $0400, size = $4C00, file = %O;
    OVL1: start = $5000, size = $1000, file = "%O.1";
    OVL2: start = $5000, size = $1000, file = "%O.2";
    OVL3: start = $5000, size = $1000, file = "%O.3";
    OVL4: start = $5000, size = $1000, file = "%O.4";
    OVL5: start = $5000, size = $1000, file = "%O.5";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp, optional = yes;
    CODE:     load = APP,  type = ro;
    DATA:     load = APP,  type = rw;
    BSS:      load = APP,  type = bss, define = yes;
    OV1:      load = OVL1, type = rw;
    OV2:      load = OVL2, type = rw;
    OV3:      load = OVL3, type = rw;
    OV4:      load = OVL4, type = rw;
    OV5:      load = OVL5, type = rw;
}
