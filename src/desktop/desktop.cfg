# ld65 configuration for GeoUltra's desktop (docs/DESKTOP.md): a GEOS
# application at $0400 (application space up to $5FFF).
MEMORY {
    ZP:   start = $0080, size = $0060;
    APP:  start = $0400, size = $5C00, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp, optional = yes;
    CODE:     load = APP, type = ro;
    DATA:     load = APP, type = rw;
    BSS:      load = APP, type = bss, define = yes;
}
